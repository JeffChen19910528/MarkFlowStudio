[package]
name = "markflow-studio"
version = "0.1.0"
description = "MarkFlow Studio - local Markdown editor"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "markflow_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
